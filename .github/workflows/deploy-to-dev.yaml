# =============================================================================
# Deploy to Dev
# =============================================================================
# Triggered on push to develop branch.
# Builds Docker image, scans for vulnerabilities, pushes to OpenShift registry,
# and deploys with Helm.
# =============================================================================

name: Deploy to Dev

on:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/**"
      - "helm/eagle-api/README.md"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_DEV: 6cdc9e-dev
  IMAGE_NAME: eagle-api
  APP_NAME: eagle-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable
      - run: yarn test

  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    outputs:
      SHORT_SHA: ${{ steps.short-sha.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get short SHA
        id: short-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

      - name: Login to OpenShift registry
        run: |
          for i in {1..5}; do
            echo "${{ secrets.OPENSHIFT_REPOSITORY_PASSWORD }}" | docker login ${{ secrets.OPENSHIFT_REPOSITORY }} --username ${{ secrets.OPENSHIFT_REPOSITORY_USERNAME }} --password-stdin && break || {
              echo "Login attempt $i failed. Retrying in 10 seconds..."
              sleep 10
            }
            if [ $i -eq 5 ]; then
              echo "Login failed after 5 attempts."
              exit 1
            fi
          done

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:dev
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:ci-latest
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev (GitOps)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: bcgov/eagle-helper-pods
          token: ${{ secrets.GITOPS_PAT }}
          ref: master

      - name: Update Dev Image Tag
        run: |
          mkdir -p argocd/environments/dev
          cat <<EOF > argocd/environments/dev/values-eagle-api.yaml
          # Auto-generated by CI workflow - DO NOT EDIT MANUALLY
          image:
            repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-api
            tag: ${{ needs.build-and-push.outputs.SHORT_SHA }}
          EOF

          git config --global user.name "EPIC GitOps Bot"
          git config --global user.email "epic-gitops-bot@gov.bc.ca"
          git add argocd/environments/dev/values-eagle-api.yaml
          git commit -m "chore(dev): promote eagle-api to ${{ needs.build-and-push.outputs.SHORT_SHA }} [skip ci]"
          git push origin master

  smoke-test:
    name: Smoke Test Dev
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable

      - name: Wait for API to be ready
        run: |
          echo "Waiting 60s for ArgoCD synchronization and rollout to complete..."
          sleep 60
          for i in $(seq 1 20); do
            # Use curl -k to bypass self-signed SSL verification on dev cluster
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://eagle-dev.apps.silver.devops.gov.bc.ca/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: API returned $STATUS, retrying in 15s..."
            sleep 15
          done
          
          if [ "$STATUS" != "200" ]; then
            echo "Error: API failed to respond with 200 OK"
            exit 1
          fi

      - name: Run smoke tests
        run: yarn test:smoke
        env:
          SMOKE_TEST_URL: https://eagle-dev.apps.silver.devops.gov.bc.ca
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

