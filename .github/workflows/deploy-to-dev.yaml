# =============================================================================
# Deploy to Dev
# =============================================================================
# Triggered on push to develop branch.
# Builds Docker image, scans for vulnerabilities, pushes to OpenShift registry,
# and deploys with Helm.
# =============================================================================

name: Deploy to Dev

on:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/**"
      - "helm/eagle-api/README.md"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_DEV: 6cdc9e-dev
  IMAGE_NAME: eagle-api
  APP_NAME: eagle-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable
      - run: yarn test

  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    outputs:
      SHORT_SHA: ${{ steps.short-sha.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get short SHA
        id: short-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

      - name: Login to OpenShift registry
        run: |
          for i in {1..5}; do
            echo "${{ secrets.OPENSHIFT_REPOSITORY_PASSWORD }}" | docker login ${{ secrets.OPENSHIFT_REPOSITORY }} --username ${{ secrets.OPENSHIFT_REPOSITORY_USERNAME }} --password-stdin && break || {
              echo "Login attempt $i failed. Retrying in 10 seconds..."
              sleep 10
            }
            if [ $i -eq 5 ]; then
              echo "Login failed after 5 attempts."
              exit 1
            fi
          done

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:dev
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:ci-latest
            ${{ secrets.OPENSHIFT_REPOSITORY }}/${{ env.OPENSHIFT_NAMESPACE_TOOLS }}/${{ env.IMAGE_NAME }}:${{ steps.short-sha.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev (GitOps)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v6
        with:
          repository: bcgov/eagle-helper-pods
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          ref: master

      - name: Update Dev Image Tag
        run: |
          mkdir -p argocd/environments/dev
          cat <<EOF > argocd/environments/dev/values-eagle-api.yaml
          # Auto-generated by CI workflow - DO NOT EDIT MANUALLY
          image:
            repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-api
            tag: ${{ needs.build-and-push.outputs.SHORT_SHA }}
          EOF

          git config --global user.name "EPIC GitOps Bot"
          git config --global user.email "epic-gitops-bot@gov.bc.ca"
          git add argocd/environments/dev/values-eagle-api.yaml
          git commit -m "chore(dev): promote eagle-api to ${{ needs.build-and-push.outputs.SHORT_SHA }} [skip ci]"
          git push origin master

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Log into OpenShift
        run: oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_URL }}

      - name: Verify ArgoCD Sync Progress
        run: |
          echo "Waiting for ArgoCD application to reconcile and sync..."
          oc wait --for=jsonpath='{.status.sync.status}'=Synced applications.argoproj.io/eagle-api-dev -n 6cdc9e-tools --timeout=300s
          
          echo "Waiting for ArgoCD application health to be Healthy..."
          oc wait --for=jsonpath='{.status.health.status}'=Healthy applications.argoproj.io/eagle-api-dev -n 6cdc9e-tools --timeout=300s

  smoke-test:
    name: Smoke Test Dev
    needs: [deploy, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable

      - name: Wait for API to be ready
        run: |
          echo "Waiting 60s for ArgoCD synchronization and rollout to complete..."
          sleep 60
          EXPECTED_VERSION="${{ needs.build-and-push.outputs.SHORT_SHA }}"
          echo "Expecting running API version to be: $EXPECTED_VERSION"
          
          STATUS=0
          for i in $(seq 1 20); do
            # Fetch health response and status code
            RESPONSE=$(curl -k -s https://eagle-dev.apps.silver.devops.gov.bc.ca/api/health || echo "{}")
            HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://eagle-dev.apps.silver.devops.gov.bc.ca/api/health || echo "500")
            
            if [ "$HTTP_CODE" = "200" ]; then
              # Parse version using jq
              RUNNING_VERSION=$(echo "$RESPONSE" | jq -r .version 2>/dev/null || echo "unknown")
              echo "API returned HTTP 200 (attempt $i). Running version: $RUNNING_VERSION"
              
              if [ "$RUNNING_VERSION" = "$EXPECTED_VERSION" ]; then
                echo "Success: Running version matches expected version!"
                STATUS=200
                break
              else
                echo "Warning: Version mismatch. Expected $EXPECTED_VERSION, but API is still running $RUNNING_VERSION."
              fi
            else
              echo "Attempt $i: API returned HTTP $HTTP_CODE, retrying in 15s..."
            fi
            sleep 15
          done
          
          if [ "$STATUS" != "200" ]; then
            echo "Error: API failed to deploy and verify the correct version within 5 minutes."
            exit 1
          fi

      - name: Run smoke tests
        run: yarn test:smoke
        env:
          SMOKE_TEST_URL: https://eagle-dev.apps.silver.devops.gov.bc.ca
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

