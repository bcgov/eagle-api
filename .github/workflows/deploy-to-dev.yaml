# =============================================================================
# Deploy to Dev
# =============================================================================
# Triggered on push to develop branch.
# Builds Docker image, scans for vulnerabilities, pushes to OpenShift registry,
# and deploys with Helm.
# =============================================================================

name: Deploy to Dev

on:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/**"
      - "helm/eagle-api/README.md"
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions: write-all

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_DEV: 6cdc9e-dev
  IMAGE_NAME: eagle-api
  APP_NAME: eagle-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable
      - run: yarn test

  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    outputs:
      SHORT_SHA: ${{ steps.short-sha.outputs.SHA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get short SHA
        id: short-sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image for scanning
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_CR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:ci-latest
            ghcr.io/${{ github.repository }}:${{ steps.short-sha.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev
    needs: [build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ env.OPENSHIFT_NAMESPACE_DEV }}

      - name: Import image from GHCR
        run: |
          # Point local ImageStreamTag to GHCR with --scheduled flag to trigger automatic background controller import
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag ghcr.io/${{ github.repository }}:dev ${{ env.IMAGE_NAME }}:dev --reference-policy=local --scheduled

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.APP_NAME }} ./helm/${{ env.APP_NAME }} \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_DEV }} \
            --values ./helm/${{ env.APP_NAME }}/values-dev.yaml \
            --set image.tag=dev \
            --wait --timeout=5m
          
          echo "Restarting deployment to pull updated image..."
          oc rollout restart deployment/${{ env.APP_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE_DEV }}

      - name: Verify deployment
        run: |
          echo "Waiting for rollout to complete..."
          oc rollout status deployment/${{ env.APP_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE_DEV }} --timeout=5m
          
          echo "Deployment successful!"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_DEV }} -l app.kubernetes.io/name=${{ env.APP_NAME }}
          
          # Verify MongoDB deployment if enabled
          if oc get deployment eagle-api-mongodb -n ${{ env.OPENSHIFT_NAMESPACE_DEV }} &>/dev/null; then
            echo ""
            echo "Verifying MongoDB deployment..."
            oc rollout status deployment/eagle-api-mongodb -n ${{ env.OPENSHIFT_NAMESPACE_DEV }} --timeout=3m
            echo "✓ MongoDB deployment verified"
          fi

  smoke-test:
    name: Smoke Test Dev
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable

      - name: Wait for API to be ready
        run: |
          echo "Waiting 30s for pod to stabilise after rollout..."
          sleep 30
          for i in $(seq 1 10); do
            # Use curl -k to bypass self-signed SSL verification on dev cluster
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://eagle-dev.apps.silver.devops.gov.bc.ca/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: API returned $STATUS, retrying in 15s..."
            sleep 15
          done
          
          if [ "$STATUS" != "200" ]; then
            echo "Error: API failed to respond with 200 OK"
            exit 1
          fi

      - name: Run smoke tests
        run: yarn test:smoke
        env:
          SMOKE_TEST_URL: https://eagle-dev.apps.silver.devops.gov.bc.ca
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

