# =============================================================================
# Deploy to Test
# =============================================================================
# Manually triggered workflow to deploy to test environment.
# Uses workflow_dispatch with optional image_tag input.
# Defaults to promoting the 'dev' tagged image.
# =============================================================================

name: Deploy to Test

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (commit SHA or "dev")'
        required: false
        default: 'dev'
        type: string

permissions: write-all

env:
  OPENSHIFT_NAMESPACE: 6cdc9e-tools
  OPENSHIFT_TEST_NAMESPACE: 6cdc9e-test
  IMAGE_NAME: eagle-api

jobs:
  deploy:
    name: Deploy to Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set image tag
        id: image-tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "dev" ]; then
            echo "Using 'dev' tag"
            echo "TAG=dev" >> $GITHUB_OUTPUT
          else
            echo "Using provided tag: $TAG"
            echo "TAG=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4.14"
          skip_cache: true

      - name: Log into OpenShift
        uses: redhat-actions/oc-login@v1.3
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}

      - name: Backup and Tag image for Test
        run: |
          # Backup current test image
          echo "Backing up current test image..."
          oc tag ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:test \
                 ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:test-backup || true
          
          # Tag new image for test
          echo "Tagging image ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.TAG }} as 'test'"
          oc tag ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.TAG }} \
                 ${{ env.OPENSHIFT_NAMESPACE }}/${{ env.IMAGE_NAME }}:test

      - name: Verify Deployment
        run: |
          echo "Checking deployment status..."
          oc rollout status dc/eagle-api -n ${{ env.OPENSHIFT_TEST_NAMESPACE }} --timeout=300s || true
          
          echo "Current deployment:"
          oc get dc/eagle-api -n ${{ env.OPENSHIFT_TEST_NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}'

      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | test |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | ${{ steps.image-tag.outputs.TAG }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "To deploy to Production, manually trigger the **Deploy to Prod** workflow with image tag: \`${{ steps.image-tag.outputs.TAG }}\`" >> $GITHUB_STEP_SUMMARY
