# =============================================================================
# Deploy to Test
# =============================================================================
# Manually triggered workflow to deploy a version to test environment.
# Requires semantic version tag (v1.2.3).
# Creates Git tag and GitHub Release if this is a new version.
# =============================================================================

name: Deploy to Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSHIFT_NAMESPACE_TOOLS: 6cdc9e-tools
  OPENSHIFT_NAMESPACE_TEST: 6cdc9e-test
  IMAGE_NAME: eagle-api
  APP_NAME: eagle-api

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format v1.2.3"
            exit 1
          fi

      - name: Check tag and release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          needs_release=false
          if ! git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} does not exist - will create tag and release"
            needs_release=true
          elif ! gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag exists but no GitHub Release - will create release"
            needs_release=true
          else
            echo "Tag and release both exist - skipping"
          fi
          echo "needs_release=$needs_release" >> $GITHUB_OUTPUT

  release:
    name: Create Release
    needs: validate
    if: needs.validate.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create Git tag
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version }} already exists - skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ inputs.version }} already exists - skipping"
          else
            gh release create "${{ inputs.version }}" \
              --title "Release ${{ inputs.version }}" \
              --generate-notes \
              --draft
          fi

  deploy:
    name: Deploying ${{ inputs.version }} to Test
    needs: [validate, release]
    if: |
      needs.validate.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository at version tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install OpenShift CLI
        run: |
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz"
          tar -xvzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/
          rm -f openshift-client-linux.tar.gz

      - name: Log into OpenShift
        run: oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_URL }}

      - name: Check if image exists and tag if needed
        run: |
          if oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} get imagestreamtag ${{ env.IMAGE_NAME }}:${{ inputs.version }} &>/dev/null; then
            echo "Image tag ${{ inputs.version }} already exists - using existing image"
          else
            echo "Image tag ${{ inputs.version }} does not exist - tagging from ci-latest"
            oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
              ${{ env.IMAGE_NAME }}:ci-latest ${{ env.IMAGE_NAME }}:${{ inputs.version }}
          fi

      - name: Tag version as test
        run: |
          echo "Tagging ${{ inputs.version }} as test..."
          oc -n ${{ env.OPENSHIFT_NAMESPACE_TOOLS }} tag \
            ${{ env.IMAGE_NAME }}:${{ inputs.version }} ${{ env.IMAGE_NAME }}:test

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.APP_NAME }} ./helm/${{ env.APP_NAME }} \
            --namespace ${{ env.OPENSHIFT_NAMESPACE_TEST }} \
            --values ./helm/${{ env.APP_NAME }}/values-test.yaml \
            --set image.tag=test \
            --wait --timeout=5m

      - name: Verify deployment
        run: |
          echo "Deployment successful!"
          oc get pods -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} -l app.kubernetes.io/name=${{ env.APP_NAME }}
          
          # Verify MongoDB deployment if enabled
          if oc get deployment eagle-api-mongodb -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} &>/dev/null; then
            echo ""
            echo "Verifying MongoDB deployment..."
            oc rollout status deployment/eagle-api-mongodb -n ${{ env.OPENSHIFT_NAMESPACE_TEST }} --timeout=3m
            echo "✓ MongoDB deployment verified"
          fi

  smoke-test:
    name: Smoke Test Test
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable Corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: "yarn"

      - run: yarn install --immutable

      - name: Wait for API to be ready
        run: |
          echo "Waiting 30s for pod to stabilise after rollout..."
          sleep 30
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://eagle-test.apps.silver.devops.gov.bc.ca/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "API is ready (attempt $i)"
              break
            fi
            echo "Attempt $i: API returned $STATUS, retrying in 15s..."
            sleep 15
          done

      - name: Run smoke tests
        run: yarn test:smoke
        env:
          SMOKE_TEST_URL: https://eagle-test.apps.silver.devops.gov.bc.ca
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}




