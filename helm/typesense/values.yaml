# Default values for the Typesense search engine + sync service.
# Override in values-{env}.yaml for environment-specific settings.
# Tear down everything: helm uninstall typesense -n <namespace>

# ---------------------------------------------------------------------------
# Typesense server
# ---------------------------------------------------------------------------
typesense:
  image:
    repository: typesense/typesense
    tag: "30.1"
    pullPolicy: IfNotPresent

  port: 8108

  # Existing secret containing TYPESENSE_API_KEY.
  # Create before deploying:
  #   oc create secret generic typesense-api-key \
  #     --from-literal=TYPESENSE_API_KEY=<key> -n <namespace>
  existingSecret: typesense-api-key

  persistence:
    size: 5Gi
    storageClass: netapp-block-standard   # Block storage preferred for search indexes
    mountPath: /data

  # Safety valve: Typesense rejects writes at this % of container memory limit
  # instead of silently growing to OOM. Sync/reindex jobs get 429 and retry.
  memoryUsedMaxPercentage: 85

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 4Gi

  probes:
    # Startup probe gates liveness/readiness until Typesense has finished loading
    # all collections into memory (can take minutes with 60k+ docs on cold start).
    startup:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30    # 5 min total budget (30 * 10s)
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ---------------------------------------------------------------------------
# Sync service — Change Stream listener (long-running deployment)
# ---------------------------------------------------------------------------
sync:
  enabled: true

  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/typesense-sync
    tag: "latest"
    pullPolicy: Always

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ---------------------------------------------------------------------------
# Nightly re-index CronJob — full sync with zero-downtime alias swap
# ---------------------------------------------------------------------------
reindex:
  enabled: true
  schedule: "0 2 * * *"    # 2:00 AM daily

  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/typesense-sync
    tag: "latest"
    pullPolicy: Always

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  backoffLimit: 2
  ttlSecondsAfterFinished: 3600

# ---------------------------------------------------------------------------
# Popularity sync CronJob — patches click scores from penguin-analytics into
# the Typesense popularity field.  Runs at 3 AM, 1 hour after the re-index.
#
# Requires a pre-created secret containing penguin-analytics DB credentials:
#   oc create secret generic penguin-analytics-db \
#     --from-literal=PENGUIN_DB_HOST=penguin-analytics-database \
#     --from-literal=PENGUIN_DB_PORT=5432 \
#     --from-literal=PENGUIN_DB_NAME=analytics \
#     --from-literal=PENGUIN_DB_USER=analytics_user \
#     --from-literal=PENGUIN_DB_PASSWORD=<password> \
#     -n <namespace>
# ---------------------------------------------------------------------------
popularity:
  enabled: false          # Enable once penguin-analytics is deployed in this namespace
  schedule: "0 3 * * *"  # 3:00 AM daily — after re-index completes at 2 AM

  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/typesense-sync
    tag: "latest"
    pullPolicy: Always

  # Name of the secret containing penguin-analytics DB connection details
  penguinSecret: penguin-analytics-db

  # Rolling window for click score aggregation (days)
  windowDays: 30

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  backoffLimit: 2
  ttlSecondsAfterFinished: 3600

# ---------------------------------------------------------------------------
# MongoDB connection info (reads from existing eagle-api-mongodb secret)
# ---------------------------------------------------------------------------
mongodb:
  existingSecret: eagle-api-mongodb
  secretKeys:
    user: MONGODB_USER
    password: MONGODB_PASSWORD
    database: MONGODB_DATABASE
  host: eagle-api-mongodb
  port: 27017
  authSource: admin

# ---------------------------------------------------------------------------
# Cleanup CronJob — deletes stale timestamped collections not referenced by
# any alias. The nightly reindex creates new timestamped collections but never
# deletes the previous ones; they accumulate and waste memory on startup.
# Runs after reindex (2 AM) and popularity (3 AM) jobs.
# ---------------------------------------------------------------------------
cleanup:
  enabled: true
  schedule: "30 3 * * *"   # 3:30 AM daily — after popularity sync

  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/typesense-sync
    tag: "dev"             # Override per env in values-{env}.yaml
    pullPolicy: Always

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  ttlSecondsAfterFinished: 3600

# ---------------------------------------------------------------------------
# Content extraction CronJob — extracts text from public PDFs, stores as
# DocumentChunk records in MongoDB, which the Change Stream and nightly
# reindex then sync to the document_chunks Typesense collection.
#
# Runs at 4 AM — after reindex (2 AM), popularity (3 AM), cleanup (3:30 AM).
#
# Requires: eagle-api-minio-keys secret (same secret used by eagle-api pod).
# ---------------------------------------------------------------------------
contentExtract:
  enabled: false          # Enable after Phase 0 infra changes (RAM/PVC expansion)
  schedule: "0 */2 * * *"  # Every 2 hours — separate pod, zero impact on eagle-api

  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/typesense-sync
    tag: "latest"
    pullPolicy: Always

  minioSecret:
    name: eagle-api-minio-keys
    hostKey: MINIO_HOST
    accessKeyKey: MINIO_ACCESS_KEY
    secretKeyKey: MINIO_SECRET_KEY
    bucketKey: MINIO_BUCKET_NAME

  # Optional tuning env vars (override chunker.js defaults)
  env: {}
    # MAX_CHUNK_SIZE: "4000"
    # MAX_PAGES_PER_DOC: "200"
    # CONTENT_EXTRACT_CONCURRENCY: "10"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
