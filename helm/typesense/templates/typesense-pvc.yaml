apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "typesense.fullname" . }}-data
  annotations:
    # Prevent Helm from patching or deleting this PVC on upgrade/uninstall.
    # Storage resizing must be done manually: oc edit pvc <name> -n <namespace>
    helm.sh/resource-policy: keep
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.typesense.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.typesense.persistence.size }}
