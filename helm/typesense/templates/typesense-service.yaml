apiVersion: v1
kind: Service
metadata:
  name: {{ include "typesense.fullname" . }}
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "typesense.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.typesense.port }}
    targetPort: http
    protocol: TCP
