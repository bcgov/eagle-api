{{- if .Values.sync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "typesense.fullname" . }}-sync
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate    # Single instance — avoid duplicate Change Stream consumers
  selector:
    matchLabels:
      {{- include "typesense.sync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "typesense.sync.selectorLabels" . | nindent 8 }}
        # role: api-eagle-epic grants MongoDB access via eagle-epic-allow-services-to-database NetworkPolicy
        role: api-eagle-epic
    spec:
      containers:
      - name: sync
        image: "{{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}"
        imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
        # Default CMD in Dockerfile runs the Change Stream listener (src/index.js)
        env:
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.existingSecret }}
              key: {{ .Values.mongodb.secretKeys.user }}
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.existingSecret }}
              key: {{ .Values.mongodb.secretKeys.password }}
        - name: MONGODB_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.existingSecret }}
              key: {{ .Values.mongodb.secretKeys.database }}
        - name: MONGODB_HOST
          value: {{ .Values.mongodb.host | quote }}
        - name: MONGODB_PORT
          value: {{ .Values.mongodb.port | quote }}
        - name: MONGODB_AUTHSOURCE
          value: {{ .Values.mongodb.authSource | quote }}
        - name: TYPESENSE_HOST
          value: {{ include "typesense.fullname" . }}
        - name: TYPESENSE_PORT
          value: {{ .Values.typesense.port | quote }}
        - name: TYPESENSE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.typesense.existingSecret }}
              key: TYPESENSE_API_KEY
        resources:
          {{- toYaml .Values.sync.resources | nindent 10 }}
{{- end }}
