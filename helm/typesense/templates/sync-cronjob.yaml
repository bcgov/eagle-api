{{- if .Values.reindex.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "typesense.fullname" . }}-reindex
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.reindex.schedule | quote }}
  concurrencyPolicy: Forbid     # Never overlap re-index runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.reindex.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.reindex.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            role: api-eagle-epic    # Grants MongoDB access via NetworkPolicy
        spec:
          restartPolicy: OnFailure
          containers:
          - name: reindex
            image: "{{ .Values.reindex.image.repository }}:{{ .Values.reindex.image.tag }}"
            imagePullPolicy: {{ .Values.reindex.image.pullPolicy }}
            command: ["node", "src/full-sync.js"]
            env:
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.user }}
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.password }}
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.database }}
            - name: MONGODB_HOST
              value: {{ .Values.mongodb.host | quote }}
            - name: MONGODB_PORT
              value: {{ .Values.mongodb.port | quote }}
            - name: MONGODB_AUTHSOURCE
              value: {{ .Values.mongodb.authSource | quote }}
            - name: TYPESENSE_HOST
              value: {{ include "typesense.fullname" . }}
            - name: TYPESENSE_PORT
              value: {{ .Values.typesense.port | quote }}
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.typesense.existingSecret }}
                  key: TYPESENSE_API_KEY
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            resources:
              {{- toYaml .Values.reindex.resources | nindent 14 }}
{{- end }}
