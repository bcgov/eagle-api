{{- if .Values.contentExtract.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "typesense.fullname" . }}-content-extract
  labels:
    {{- include "typesense.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.contentExtract.schedule | quote }}
  concurrencyPolicy: Forbid     # Never overlap extraction runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.contentExtract.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.contentExtract.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            role: api-eagle-epic    # Grants MongoDB access via NetworkPolicy
        spec:
          restartPolicy: OnFailure
          containers:
          - name: content-extract
            image: "{{ .Values.contentExtract.image.repository }}:{{ .Values.contentExtract.image.tag }}"
            imagePullPolicy: {{ .Values.contentExtract.image.pullPolicy }}
            command: ["node", "src/content-extract.js"]
            env:
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.user }}
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.password }}
            - name: MONGODB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.database }}
            - name: MONGODB_HOST
              value: {{ .Values.mongodb.host | quote }}
            - name: MONGODB_PORT
              value: {{ .Values.mongodb.port | quote }}
            - name: MONGODB_AUTHSOURCE
              value: {{ .Values.mongodb.authSource | quote }}
            - name: MINIO_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contentExtract.minioSecret.name }}
                  key: {{ .Values.contentExtract.minioSecret.hostKey }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contentExtract.minioSecret.name }}
                  key: {{ .Values.contentExtract.minioSecret.accessKeyKey }}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contentExtract.minioSecret.name }}
                  key: {{ .Values.contentExtract.minioSecret.secretKeyKey }}
            - name: MINIO_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contentExtract.minioSecret.name }}
                  key: {{ .Values.contentExtract.minioSecret.bucketKey }}
            {{- if .Values.contentExtract.env }}
            {{- range $key, $val := .Values.contentExtract.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
            resources:
              {{- toYaml .Values.contentExtract.resources | nindent 14 }}
{{- end }}
