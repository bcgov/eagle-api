sync:
  image:
    tag: prod

reindex:
  image:
    tag: prod

typesense:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 4Gi

cleanup:
  image:
    tag: prod

contentExtract:
  enabled: false
  image:
    tag: prod
  env:
    CONTENT_EXTRACT_CONCURRENCY: "3"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
