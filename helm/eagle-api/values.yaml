# Default values for eagle-api
# Override in values-{env}.yaml for environment-specific settings

replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-api
  pullPolicy: Always
  tag: "latest"
  # For OpenShift ImageStreamTag trigger
  name: eagle-api
  namespace: 6cdc9e-tools

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000

route:
  enabled: true
  host: ""  # Set in values-{env}.yaml
  targetPort: "3000-tcp"
  serviceName: "rproxy"  # API is proxied through rproxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Liveness and readiness probes
probes:
  liveness:
    path: /api/docs
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  readiness:
    path: /api/docs
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
  # Startup probe for slow-starting containers (optional, enable in prod)
  startup:
    path: /api/docs
    failureThreshold: 30
    periodSeconds: 5

# Pod Disruption Budget
podDisruptionBudget:
  minAvailable: 1  # Minimum pods available during disruptions

# Persistent Volume Claim for document uploads
persistence:
  enabled: true
  size: 1Gi
  mountPath: /opt/app-root/src/uploads
  storageClass: netapp-file-standard

# Environment variables
env:
  # MongoDB Configuration
  MONGODB_SERVICE_HOST: eagle-api-mongodb
  MONGODB_DATABASE: epic
  MONGODB_AUTHSOURCE: admin
  
  # Feature Flags
  ENABLE_VIRUS_SCANNING: "true"
  
  # External Services
  CHES_ENDPOINT: ""  # Set in values-{env}.yaml
  GETOK_ENDPOINT: ""  # Set in values-{env}.yaml

# Secret references (existing OpenShift secrets)
secrets:
  mongodb:
    name: eagle-api-mongodb
    usernameKey: MONGODB_USER
    passwordKey: MONGODB_PASSWORD
  
  minio:
    name: eagle-api-minio-keys
    hostKey: MINIO_HOST
    accessKeyKey: MINIO_ACCESS_KEY
    secretKeyKey: MINIO_SECRET_KEY
    bucketKey: MINIO_BUCKET_NAME
  
  ches:
    name: getok-secret
    clientIdKey: _GETOK_CLIENTID
    clientSecretKey: _GETOK_CLIENT_SECRET

# Keycloak SSO Configuration
keycloak:
  enabled: true
  url: ""  # Set in values-{env}.yaml
  realm: eao-epic
  clientId: eagle-api-console

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Database migrations job
# Note: All migrations are from 2019-2020 and have been applied in production.
# Only enable this when adding NEW migrations to the codebase.
# To run migrations: helm upgrade --set migrations.enabled=true
migrations:
  enabled: false
  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-api
    tag: "latest"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# MongoDB Configuration
# Disabled by default for local development (use external MongoDB)
# Enable in environment values files (values-dev.yaml, values-test.yaml, values-prod.yaml)
mongodb:
  enabled: false
  
  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/mongodb-80
    tag: "8.0"
    pullPolicy: Always
  
  # Existing secret with MongoDB credentials
  # Secret keys are mapped to official mongo:8.0 env vars in the deployment template
  existingSecret: eagle-api-mongodb
  secretKeys:
    user: MONGODB_USER
    password: MONGODB_PASSWORD
    database: MONGODB_DATABASE
  
  # PVC for MongoDB data persistence
  # Set existingClaim to use a pre-existing PVC, or leave empty to auto-create
  persistence:
    existingClaim: ""
    mountPath: /data/db
    size: 5Gi
    storageClass: netapp-file-standard
  
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 2Gi
  
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3

