# Default values for eagle-api
# Override in values-{env}.yaml for environment-specific settings

replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-api
  pullPolicy: Always
  tag: "v2.10.42"
  # For OpenShift ImageStreamTag trigger
  name: eagle-api
  namespace: 6cdc9e-tools

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000

route:
  # OFF BY DEFAULT, and the default is the safety. Production is the one environment where a route
  # from this chart is never right — `prod-external` already serves that host through rproxy and
  # carries its certificate — so prod must not have to remember to opt out. dev and test opt IN.
  enabled: false
  host: ""  # Set in values-{env}.yaml
  targetPort: "8080-tcp"
  serviceName: "rproxy"  # API is proxied through rproxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Second Route, straight to this chart's own Service, so Azure Front Door can reach eagle-api
# without going through rproxy. Off by default for the same reason as route.enabled above.
directRoute:
  enabled: false
  host: ""  # Set in values-{env}.yaml

resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Liveness and readiness probes
probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
  # Startup probe for slow-starting containers (optional, enable in prod)
  startup:
    path: /api/health
    failureThreshold: 30
    periodSeconds: 5

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1  # Minimum pods available during disruptions

# Persistent Volume Claim for document uploads
persistence:
  enabled: true
  size: 1Gi
  mountPath: /opt/app-root/src/uploads
  storageClass: netapp-file-standard

# Environment variables
env:
  # MongoDB Configuration
  MONGODB_SERVICE_HOST: eagle-api-mongodb
  MONGODB_DATABASE: epic
  MONGODB_AUTHSOURCE: admin
  
  # Feature Flags
  ENABLE_VIRUS_SCANNING: "true"

  
  # External Services
  CHES_ENDPOINT: ""  # Set in values-{env}.yaml
  GETOK_ENDPOINT: ""  # Set in values-{env}.yaml


# Secret references (existing OpenShift secrets)
# Not listed here, hardcoded in deployment.yaml because they are the same in every environment
# and optional: demi-push-secret/DEMI_APIM_KEY, and
# eagle-api-appinsights/APPLICATIONINSIGHTS_CONNECTION_STRING (created by hand per environment;
# unset means Azure Monitor stays off).
secrets:
  mongodb:
    name: eagle-api-mongodb
    usernameKey: MONGODB_USER
    passwordKey: MONGODB_PASSWORD
  
  minio:
    name: eagle-api-minio-keys
    hostKey: MINIO_HOST
    accessKeyKey: MINIO_ACCESS_KEY
    secretKeyKey: MINIO_SECRET_KEY
    bucketKey: MINIO_BUCKET_NAME
  
  ches:
    name: getok-secret
    clientIdKey: _GETOK_CLIENTID
    clientSecretKey: _GETOK_CLIENT_SECRET

  # Optional. Set per-env (like smokeApiKey) to a secret holding the Azure Front Door profile GUID.
  # Unset means the rate limiter keys on req.ip, which is correct wherever Front Door is not in front.
  # frontDoorId:
  #   name: eagle-api-front-door
  #   key: FRONT_DOOR_ID

  # Optional. Set on dev/test only, to a secret holding the access curtain password.
  # Unset means no gate: POST /api/public/gate 404s. Never set in prod.
  # accessGatePassword:
  #   name: eagle-api-access-gate
  #   key: ACCESS_GATE_PASSWORD


# Keycloak SSO Configuration
keycloak:
  enabled: true
  url: ""  # Set in values-{env}.yaml
  realm: eao-epic
  clientId: eagle-api-console

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Database migrations job
# Note: All migrations are from 2019-2020 and have been applied in production.
# Only enable this when adding NEW migrations to the codebase.
# To run migrations: helm upgrade --set migrations.enabled=true
migrations:
  enabled: false
  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/eagle-api
    tag: "v2.10.42"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# MongoDB Configuration
# Disabled by default for local development (use external MongoDB)
# Enable in environment values files (values-dev.yaml, values-test.yaml, values-prod.yaml)
mongodb:
  enabled: false
  
  image:
    repository: image-registry.openshift-image-registry.svc:5000/6cdc9e-tools/mongodb-80
    tag: "8.0"
    pullPolicy: Always
  
  # Existing secret with MongoDB credentials
  # Secret keys are mapped to official mongo:8.0 env vars in the deployment template
  existingSecret: eagle-api-mongodb
  secretKeys:
    user: MONGODB_USER
    password: MONGODB_PASSWORD
    database: MONGODB_DATABASE
  
  # PVC for MongoDB data persistence
  # Set existingClaim to use a pre-existing PVC, or leave empty to auto-create
  persistence:
    existingClaim: ""
    mountPath: /data/db
    size: 10Gi
    storageClass: netapp-file-standard
  
  # WiredTiger cache size in GB. Recommend ~37% of memory limit.
  # Default (unset): MongoDB auto-calculates (50% of (RAM-1GB)).
  wiredTigerCacheSizeGB: null

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 2Gi
  
  probes:
    startup:
      # Allows up to 5 + (5 × 60) = 305s for MongoDB to start before kill.
      # Protects against WiredTiger journal recovery after unclean shutdown.
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 3
      periodSeconds: 15   # Reduced from 10 — fewer probe spawns = fewer potential zombies (defence-in-depth)
      timeoutSeconds: 1
      failureThreshold: 3

  # Automated backup CronJob
  # Dumps the epic database to an archive on a PVC
  backup:
    enabled: false
    schedule: "0 8 * * *"  # Daily at 8 AM UTC
    retention: 5  # Number of backup archives to keep
    # PVC for backup storage
    pvc:
      existingClaim: ""  # Set to use a pre-existing PVC
      size: 10Gi
      storageClass: netapp-file-backup
    # Minimum archive size (bytes) to consider backup healthy
    minArchiveSize: 1048576  # 1 MB
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi

# Materialized view refresh cron jobs
# Two jobs: hot (frequent, recent data) and cold (nightly, full refresh)
cronJobs:
  enabled: false  # Enable in values-{env}.yaml

  # CronJobs reuse the eagle-api image (image/pullPolicy from top-level image values)
  # and connect directly to MongoDB — no HTTP API call needed.

  # MongoDB secret and host for direct DB connection in worker pods
  # secretName: name of the secret holding database-name/user/password keys
  # (defaults to the mongodb existingSecret value)
  mongodb:
    secretName: eagle-api-mongodb
    host: eagle-api-mongodb

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  jobs:
    - name: eagle-cron-hot
      subset: hot
      schedule: "*/30 * * * *"
      enabled: true
    - name: eagle-cron-cold
      subset: cold
      schedule: "0 2 * * *"
      enabled: true
