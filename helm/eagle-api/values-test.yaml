# Test environment values for eagle-api

replicaCount: 1

image:
  tag: test

route:
  enabled: true  # opt in; the chart default is off (see values.yaml)
  host: eagle-test.apps.silver.devops.gov.bc.ca

directRoute:
  enabled: true
  host: eagle-api-6cdc9e-test.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 500m
    memory: 4Gi
  requests:
    cpu: 250m
    memory: 512Mi

env:
  LOG_LEVEL: "debug"
  API_HOSTNAME: eagle-test.apps.silver.devops.gov.bc.ca
  CHES_ENDPOINT: "https://ches-test.api.gov.bc.ca/api/v1"
  GETOK_ENDPOINT: "https://sso-test.pathfinder.gov.bc.ca"
  DEMI_API_BASE: "https://demi-apim-test.azure-api.net/machine"
  # ClamAV virus scanning - service runs in separate pod
  CLAMAV_SERVICE_HOST: "clamav"
  CLAMAV_SERVICE_PORT: "3310"
  ENABLE_VIRUS_SCANNING: "true"
  UPLOAD_DIRECTORY: "/tmp/"
  OTEL_SERVICE_NAME: "eagle-api"

keycloak:
  url: "https://test.loginproxy.gov.bc.ca/auth"
  realm: eao-epic
  clientId: eagle-api-console

secrets:
  mongodb:
    name: eagle-api-mongodb
    usernameKey: MONGODB_USER
    passwordKey: MONGODB_PASSWORD
  minio:
    name: nr-object-store-credential
    hostKey: endpoint_url
    accessKeyKey: user_account
    secretKeyKey: password
    bucketKey: bucket_name
  ches:
    name: getok-secret
    clientIdKey: CLIENTID
    clientSecretKey: CLIENT_SECRET
  smokeApiKey:
    name: eagle-api-smoke-key
    key: SMOKE_API_KEY
  frontDoorId:
    name: eagle-api-front-door
    key: FRONT_DOOR_ID
  accessGatePassword:
    name: eagle-api-access-gate
    key: ACCESS_GATE_PASSWORD

# Disable persistence to avoid PVC attachment issues
persistence:
  enabled: false

autoscaling:
  enabled: false

# Materialized view refresh cron jobs
cronJobs:
  enabled: true

# MongoDB enabled for test environment
mongodb:
  enabled: true
  wiredTigerCacheSizeGB: 1.0  # 33% of 3Gi limit — explicit, leaves ~2Gi for connections + threads
  persistence:
    existingClaim: ""
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 3Gi

