# Development environment values for eagle-api

replicaCount: 1

image:
  tag: dev

route:
  enabled: false  # All traffic goes through eagle-public route -> nginx -> /api paths
  host: eagle-dev.apps.silver.devops.gov.bc.ca

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  API_HOSTNAME: eagle-dev.apps.silver.devops.gov.bc.ca
  CHES_ENDPOINT: "https://ches-dev.api.gov.bc.ca/api/v1"
  GETOK_ENDPOINT: "https://sso-dev.pathfinder.gov.bc.ca"
  ENABLE_VIRUS_SCANNING: "false"
  UPLOAD_DIRECTORY: "/tmp/"
  TYPESENSE_ENABLED: "true"
  TYPESENSE_HOST: typesense-typesense

keycloak:
  url: "https://dev.loginproxy.gov.bc.ca/auth"
  realm: eao-epic
  clientId: eagle-api-console

secrets:
  mongodb:
    name: eagle-api-mongodb
    usernameKey: MONGODB_USER
    passwordKey: MONGODB_PASSWORD
  minio:
    name: nr-object-store-credential
    hostKey: endpoint_url
    accessKeyKey: user_account
    secretKeyKey: password
    bucketKey: bucket_name
  ches:
    name: getok-secret
    clientIdKey: CLIENTID
    clientSecretKey: CLIENT_SECRET
  smokeApiKey:
    name: eagle-api-smoke-key
    key: SMOKE_API_KEY

# Disable persistence to avoid PVC attachment issues
persistence:
  enabled: false

autoscaling:
  enabled: false

# MongoDB enabled for dev environment
mongodb:
  enabled: true
  persistence:
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 3Gi

