apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eagle-api.fullname" . }}
  labels:
    {{- include "eagle-api.labels" . | nindent 4 }}
  annotations:
    # Trigger automatic rollout when ImageStreamTag is updated
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"{{ .Values.image.name | default "eagle-api" }}:{{ .Values.image.tag }}","namespace":"{{ .Values.image.namespace | default "6cdc9e-tools" }}"},"fieldPath":"spec.template.spec.containers[?(@.name==\"{{ .Chart.Name }}\")].image"}]
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # Never terminate pods until new ones are ready
      maxSurge: 1          # Create one new pod at a time
  {{- end }}
  selector:
    matchLabels:
      {{- include "eagle-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "eagle-api.selectorLabels" . | nindent 8 }}
        role: api-eagle-epic
    spec:
      {{- if .Values.mongodb.enabled }}
      initContainers:
        - name: wait-for-mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              echo "Waiting for MongoDB RS primary at eagle-api-mongodb:27017..."
              for i in $(seq 1 60); do
                result=$(HOME=/tmp mongosh "mongodb://eagle-api-mongodb:27017/?directConnection=true" \
                  -u "$MONGO_USER" -p "$MONGO_PASS" \
                  --authenticationDatabase admin --quiet \
                  --eval "db.adminCommand('hello').isWritablePrimary" 2>/dev/null)
                if [ "$result" = "true" ]; then
                  echo "MongoDB RS primary ready."
                  exit 0
                fi
                echo "Attempt $i: not primary yet (result: $result), waiting 3s..."
                sleep 3
              done
              echo "ERROR: MongoDB RS primary not available after 180s"
              exit 1
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.user }}
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.secretKeys.password }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- if .Values.probes.startup }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]  # Grace period for load balancer to drain
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # MongoDB Configuration from Secret
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mongodb.name }}
                  key: {{ .Values.secrets.mongodb.usernameKey }}
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mongodb.name }}
                  key: {{ .Values.secrets.mongodb.passwordKey }}
            # Minio Configuration from Secret
            - name: MINIO_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio.name }}
                  key: {{ .Values.secrets.minio.hostKey }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio.name }}
                  key: {{ .Values.secrets.minio.accessKeyKey }}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio.name }}
                  key: {{ .Values.secrets.minio.secretKeyKey }}
            - name: MINIO_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio.name }}
                  key: {{ .Values.secrets.minio.bucketKey }}
            # CHES/GETOK Configuration from Secret
            - name: _GETOK_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ches.name }}
                  key: {{ .Values.secrets.ches.clientIdKey }}
            - name: _GETOK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ches.name }}
                  key: {{ .Values.secrets.ches.clientSecretKey }}
            # DEMI push key — optional; pods start without the secret
            - name: DEMI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: demi-push-secret
                  key: DEMI_API_KEY
                  optional: true
            {{- if .Values.secrets.smokeApiKey }}
            # Smoke test API key — dev/test only, never set in prod
            - name: SMOKE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.smokeApiKey.name }}
                  key: {{ .Values.secrets.smokeApiKey.key }}
            {{- end }}
            {{- if .Values.secrets.frontDoorId }}
            # Azure Front Door profile id — proves a request reached us through our edge
            - name: FRONT_DOOR_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.frontDoorId.name }}
                  key: {{ .Values.secrets.frontDoorId.key }}
            {{- end }}
            {{- if .Values.secrets.accessGatePassword }}
            # Access curtain password — dev/test only, never set in prod
            - name: ACCESS_GATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.accessGatePassword.name }}
                  key: {{ .Values.secrets.accessGatePassword.key }}
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            # Keycloak SSO Configuration
            - name: SSO_ISSUER
              value: "{{ .Values.keycloak.url }}/realms/{{ .Values.keycloak.realm }}"
            - name: SSO_JWKSURI
              value: "{{ .Values.keycloak.url }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs"
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm }}
            - name: KEYCLOAK_ENABLED
              value: "true"
            {{- end }}
          envFrom:
            # Mount ConfigMap with all other environment variables
            - configMapRef:
                name: {{ include "eagle-api.fullname" . }}
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: uploads
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp-volume
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "eagle-api.fullname" . }}-uploads
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
