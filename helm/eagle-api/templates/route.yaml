{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "eagle-api.fullname" . }}
  labels:
    {{- include "eagle-api.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  {{- if .Values.route.path }}
  path: {{ .Values.route.path }}
  {{- end }}
  port:
    targetPort: {{ .Values.route.targetPort | default "3000-tcp" }}
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
  to:
    kind: Service
    name: {{ .Values.route.serviceName | default (include "eagle-api.fullname" .) }}
    weight: 100
  wildcardPolicy: None
{{- end }}
{{- if .Values.directRoute.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "eagle-api.fullname" . }}-direct
  labels:
    {{- include "eagle-api.labels" . | nindent 4 }}
spec:
  host: {{ .Values.directRoute.host }}
  port:
    targetPort: 3000-tcp
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: {{ include "eagle-api.fullname" . }}
    weight: 100
  wildcardPolicy: None
{{- end }}
