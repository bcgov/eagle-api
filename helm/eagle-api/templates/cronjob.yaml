{{- if .Values.cronJobs.enabled }}
{{- range .Values.cronJobs.jobs }}
{{- if .enabled }}
# ==============================================================================
# CronJob: {{ .name }}
# ==============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  labels:
    {{- include "eagle-api.labels" $ | nindent 4 }}
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: eagle-cron
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: {{ .name }}
            role: api-eagle-epic
        spec:
          restartPolicy: Never
          containers:
            - name: {{ .name }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command: ["node", "worker/matview-worker.js"]
              env:
                - name: SUBSET
                  value: {{ .subset | quote }}
                - name: MONGODB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.cronJobs.mongodb.secretName }}
                      key: MONGODB_DATABASE
                - name: MONGODB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.cronJobs.mongodb.secretName }}
                      key: MONGODB_USER
                - name: MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.cronJobs.mongodb.secretName }}
                      key: MONGODB_PASSWORD
                - name: MONGODB_SERVICE_HOST
                  value: {{ $.Values.cronJobs.mongodb.host | quote }}
                - name: MONGODB_AUTHSOURCE
                  value: "admin"
              resources:
                {{- toYaml $.Values.cronJobs.resources | nindent 16 }}
---
{{- end }}
{{- end }}
{{- end }}
