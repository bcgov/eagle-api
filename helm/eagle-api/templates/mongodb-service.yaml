{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eagle-api.mongodb.fullname" . }}
  labels:
    {{- include "eagle-api.mongodb.labels" . | nindent 4 }}
spec:
  # Headless service: DNS resolves to pod IP instead of a VIP.
  # Required for MongoDB replica set — with a ClusterIP, MongoDB resolves the
  # service name to the VIP (which doesn't match any pod network interface), so
  # it puts itself in REMOVED state and Change Streams fail.
  clusterIP: None
  ports:
  - port: 27017
    targetPort: mongodb
    protocol: TCP
    name: mongodb
  selector:
    {{- include "eagle-api.mongodb.selectorLabels" . | nindent 4 }}
{{- end }}
