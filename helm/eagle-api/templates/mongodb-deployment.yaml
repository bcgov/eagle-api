{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eagle-api.mongodb.fullname" . }}
  labels:
    {{- include "eagle-api.mongodb.labels" . | nindent 4 }}
  annotations:
    description: "MongoDB database for eagle-api"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Critical: MongoDB is stateful with single replica
  selector:
    matchLabels:
      {{- include "eagle-api.mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eagle-api.mongodb.selectorLabels" . | nindent 8 }}
        role: database-eagle-epic  # Legacy label required by NetworkPolicy
    spec:
      containers:
      - name: mongodb
        image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
        imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
        # Enable replica set mode so MongoDB maintains an oplog.
        # Required for Change Streams (used by the Typesense sync service).
        # This is a single-member replica set — no HA, same resource footprint.
        # keyFile is required by MongoDB when --auth + --replSet are both active.
        # The file is copied from a Secret by the initContainer below (chmod 400).
        # Prerequisite: oc create secret generic eagle-api-mongodb-keyfile \
        #   --from-literal=keyfile="$(openssl rand -base64 756 | tr -d '\n')" -n <namespace>
        args:
          - --replSet
          - rs0
          - --keyFile
          - /etc/mongodb-keyfile/keyfile
        ports:
        - containerPort: 27017
          protocol: TCP
          name: mongodb
        lifecycle:
          postStart:
            exec:
              command:
                - bash
                - -c
                - |
                  # Phase 1: Wait for mongod to accept connections (up to 60s).
                  for i in $(seq 1 30); do
                    mongosh --quiet --eval "db.adminCommand('ping')" 2>/dev/null && break
                    sleep 2
                  done

                  MONGO_HOST="{{ include "eagle-api.mongodb.fullname" . }}:27017"
                  CONN="mongodb://localhost:27017/?directConnection=true"

                  # Phase 2: Ensure RS is configured with the correct hostname.
                  # The RS subsystem may not be ready immediately after mongod accepts
                  # connections — poll until rs.status() returns a usable state.
                  # On fresh PV: rs.status() errors with "no replset config" → rs.initiate().
                  # On existing PV: rs.status() may return STARTUP/STARTUP2/REMOVED because
                  # the stored member host differs from this pod's DNS resolution. In that
                  # case rs.reconfig({force:true}) fixes the hostname and triggers election.
                  for attempt in $(seq 1 20); do
                    result=$(mongosh "$CONN" --quiet \
                      -u "$MONGO_INITDB_ROOT_USERNAME" \
                      -p "$MONGO_INITDB_ROOT_PASSWORD" \
                      --authenticationDatabase admin \
                      --eval "
                        try {
                          var st = rs.status();
                          var state = st.myState;
                          if (state === 1) {
                            // Already PRIMARY — verify hostname is correct then done.
                            var cfg = rs.conf();
                            if (cfg.members[0].host !== '$MONGO_HOST') {
                              cfg.members[0].host = '$MONGO_HOST';
                              rs.reconfig(cfg, {force: true});
                              print('RECONFIG_DONE');
                            } else {
                              print('ALREADY_PRIMARY');
                            }
                          } else {
                            // SECONDARY/STARTUP/REMOVED — force reconfig to correct hostname
                            // and let MongoDB re-run the election.
                            var cfg = rs.conf();
                            cfg.members[0].host = '$MONGO_HOST';
                            cfg.version = (cfg.version || 1) + 1;
                            rs.reconfig(cfg, {force: true});
                            print('RECONFIG_DONE');
                          }
                        } catch(e) {
                          var msg = e.message || '';
                          if (msg.indexOf('no replset config') >= 0 ||
                              msg.indexOf('not initialized') >= 0 ||
                              msg.indexOf('NotYetInitialized') >= 0) {
                            // Fresh PV — first-time init.
                            rs.initiate({_id:'rs0', members:[{_id:0, host:'$MONGO_HOST'}]});
                            print('INITIATED');
                          } else {
                            // RS subsystem not ready yet — caller will retry.
                            print('RETRY:' + msg.substring(0, 80));
                          }
                        }
                      " 2>/dev/null)
                    echo "Attempt $attempt: $result"
                    case "$result" in
                      *ALREADY_PRIMARY*|*RECONFIG_DONE*|*INITIATED*) break ;;
                    esac
                    sleep 3
                  done || true
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.existingSecret }}
              key: {{ .Values.mongodb.secretKeys.user }}
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.existingSecret }}
              key: {{ .Values.mongodb.secretKeys.password }}
        - name: MONGO_INITDB_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.existingSecret }}
              key: {{ .Values.mongodb.secretKeys.database }}
        volumeMounts:
        - name: mongodb-data
          mountPath: {{ .Values.mongodb.persistence.mountPath | default "/data/db" }}
        - name: mongodb-keyfile
          mountPath: /etc/mongodb-keyfile
          readOnly: true
        resources:
          {{- toYaml .Values.mongodb.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: {{ .Values.mongodb.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.mongodb.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.mongodb.probes.liveness.timeoutSeconds }}
          failureThreshold: {{ .Values.mongodb.probes.liveness.failureThreshold }}
        readinessProbe:
          # Check RS PRIMARY state, not just TCP connectivity.
          # Pod is only added to Service endpoints when isWritablePrimary = true.
          # This ensures eagle-api's initContainer (which polls the Service for a
          # primary) only succeeds once MongoDB is actually ready to accept writes.
          exec:
            command:
              - bash
              - -c
              - |
                result=$(mongosh "mongodb://localhost:27017/?directConnection=true" \
                  -u "$MONGO_INITDB_ROOT_USERNAME" \
                  -p "$MONGO_INITDB_ROOT_PASSWORD" \
                  --authenticationDatabase admin --quiet \
                  --eval "db.adminCommand('hello').isWritablePrimary" 2>/dev/null)
                [ "$result" = "true" ]
          initialDelaySeconds: {{ .Values.mongodb.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.mongodb.probes.readiness.periodSeconds }}
          timeoutSeconds: 10
          failureThreshold: {{ .Values.mongodb.probes.readiness.failureThreshold }}
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: {{ .Values.mongodb.persistence.existingClaim | default (printf "%s-data-v8" (include "eagle-api.mongodb.fullname" .)) }}
      # The keyFile secret is mounted read-only into an initContainer which copies
      # it and sets chmod 400. OpenShift mounts secrets as symlinks (0777) which
      # MongoDB rejects. The emptyDir volume holds the correctly-permissioned copy.
      - name: mongodb-keyfile-secret
        secret:
          secretName: eagle-api-mongodb-keyfile
      - name: mongodb-keyfile
        emptyDir: {}
      initContainers:
      - name: keyfile-init
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            cp /etc/mongodb-keyfile-secret/keyfile /etc/mongodb-keyfile/keyfile
            chmod 400 /etc/mongodb-keyfile/keyfile
        volumeMounts:
        - name: mongodb-keyfile-secret
          mountPath: /etc/mongodb-keyfile-secret
          readOnly: true
        - name: mongodb-keyfile
          mountPath: /etc/mongodb-keyfile
{{- end }}
