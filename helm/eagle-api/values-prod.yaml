# Production environment values for eagle-api

replicaCount: 3

image:
  tag: prod

route:
  enabled: false  # Production uses prod-external route through rproxy
  host: projects.eao.gov.bc.ca

resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

env:
  API_HOSTNAME: projects.eao.gov.bc.ca
  CHES_ENDPOINT: "https://ches.api.gov.bc.ca/api/v1"
  GETOK_ENDPOINT: "https://sso.pathfinder.gov.bc.ca"
  # ClamAV virus scanning - service runs in separate pod
  CLAMAV_SERVICE_HOST: "clamav"
  CLAMAV_SERVICE_PORT: "3310"
  ENABLE_VIRUS_SCANNING: "true"
  # Temp directory for uploads (no PVC mounted)
  UPLOAD_DIRECTORY: "/tmp/"

keycloak:
  url: "https://loginproxy.gov.bc.ca/auth"
  realm: eao-epic
  clientId: eagle-api-console

# Production uses nr-object-store-credential (different from dev/test)
secrets:
  minio:
    name: nr-object-store-credential
    hostKey: endpoint_url
    accessKeyKey: user_account
    secretKeyKey: password
    bucketKey: bucket_name
  ches:
    name: getok-secret
    clientIdKey: CLIENTID
    clientSecretKey: CLIENT_SECRET

# Disable persistence - current production doesn't use uploads PVC
persistence:
  enabled: false

# Pod Disruption Budget - ensure at least 2 pods during disruptions
podDisruptionBudget:
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# MongoDB Configuration
mongodb:
  enabled: true
  persistence:
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 2Gi
  backup:
    enabled: true
    schedule: "0 8 * * *"
    retention: 2
    pvc:
      existingClaim: eagle-api-mongodb-backup
