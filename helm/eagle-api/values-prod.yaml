# Production environment values for eagle-api

replicaCount: 3

image:
  tag: prod

route:
  # Disabled, and it must stay that way until someone deliberately reconciles route ownership in
  # production. `6cdc9e-prod` ALREADY HAS a Route named `eagle-api` — host
  # eagle-prod.apps.silver.devops.gov.bc.ca, carrying the rproxy release's labels — so Helm refuses
  # to adopt it and `helm upgrade` fails outright with "invalid ownership metadata". That is not
  # theoretical: it is what happened deploying v2.10.64 on 2026-08-20, and because the Deployment
  # carries an OpenShift image trigger on `eagle-api:prod`, the image rolled anyway while the chart
  # did not — a half-applied release that reports as a failure.
  #
  # Adopting it would also rewrite that route's host to projects.eao.gov.bc.ca with path /api and
  # drop its haproxy timeout and rate-limit annotations. Production reaches eagle-api through
  # rproxy's `prod-external` route regardless, so this chart does not need to own one.
  #
  # Dev and test keep theirs: those hosts are *.apps.silver names the router's wildcard covers, and
  # nothing else claims them.
  enabled: false
  host: projects.eao.gov.bc.ca

resources:
  limits:
    cpu: 1000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

env:
  LOG_LEVEL: "error"
  API_HOSTNAME: projects.eao.gov.bc.ca
  CHES_ENDPOINT: "https://ches.api.gov.bc.ca/api/v1"
  GETOK_ENDPOINT: "https://sso.pathfinder.gov.bc.ca"
  # ClamAV virus scanning - service runs in separate pod
  CLAMAV_SERVICE_HOST: "clamav"
  CLAMAV_SERVICE_PORT: "3310"
  ENABLE_VIRUS_SCANNING: "true"

  # Temp directory for uploads (no PVC mounted)
  UPLOAD_DIRECTORY: "/tmp/"

keycloak:
  url: "https://loginproxy.gov.bc.ca/auth"
  realm: eao-epic
  clientId: eagle-api-console

# Production uses nr-object-store-credential (different from dev/test)
secrets:
  minio:
    name: nr-object-store-credential
    hostKey: endpoint_url
    accessKeyKey: user_account
    secretKeyKey: password
    bucketKey: bucket_name
  ches:
    name: getok-secret
    clientIdKey: CLIENTID
    clientSecretKey: CLIENT_SECRET

# Disable persistence - current production doesn't use uploads PVC
persistence:
  enabled: false

# Pod Disruption Budget - disabled due to Kyverno global_pods cache size limits in prod namespace
podDisruptionBudget:
  enabled: false
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# MongoDB Configuration
mongodb:
  enabled: true
  wiredTigerCacheSizeGB: 1.5
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: 500m
      memory: 4Gi
  backup:
    enabled: true
    schedule: "0 8 * * *"
    retention: 2
    pvc:
      existingClaim: eagle-api-mongodb-backup

# Materialized view refresh cron jobs
cronJobs:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: 500m
      memory: 4Gi
